# BlueZ daemon config for a headless, always-on A2DP speaker.
# Read by bluetoothd from /etc/bluetooth/main.conf.

[General]
# THE reliability fix: let a peer whose stored link key has diverged
# (phones rotate / silently re-pair keys) re-bond automatically via the
# NoInputNoOutput agent, instead of failing with "Permission denied (13)"
# on AVDTP and forcing a manual forget + re-pair. Default is "never".
JustWorksRepairing = always

# Answer inquiry/page quickly. Fine for an always-powered speaker.
FastConnectable = true

# Headless sink — no LE privacy. Also silences the controller's
# "Failed to set privacy: Rejected (0x0b)" startup error.
Privacy = off

[Policy]
# Bring controllers up automatically and keep retrying lost links.
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
